name: TU_Tech
services:
  react:
    #env_file:  build stage에서 이미 .env.production으로 build되므로 불필요
    #  - .env.production
    build: .
    deploy:
      mode: replicated
      replicas: 2
    links:
      - load_balancer:load_balancer
  load_balancer:
    image: nginx
    container_name: fe-lb
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
